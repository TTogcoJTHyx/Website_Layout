<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOVA — Modern Streetwear</title><link rel="stylesheet" href="css/reset.css"><link rel="stylesheet" href="css/themes/default.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><div class="container header-row"><button class="icon-button menu-toggle" data-menu-toggle aria-label="Открыть меню" aria-expanded="false">☰</button><a class="brand" href="index.html" data-store-name>NOVA</a><nav class="nav"><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="admin/index.html">Demo-админка</a></nav><div class="header-actions"><form class="search-form header-search" data-search-form><input name="q" aria-label="Поиск товаров" placeholder="Поиск"><button aria-label="Искать">⌕</button></form><a class="icon-button" href="cart.html" aria-label="Корзина">🛒<span class="cart-count" data-cart-count>0</span></a></div></div><nav class="mobile-nav" data-mobile-nav><a href="index.html">Главная</a><a href="catalog.html">Каталог</a><a href="admin/index.html">Demo-админка</a></nav></header>
<main><section class="hero"><div class="container hero__content"><p class="eyebrow">NOVA / New collection</p><h1 data-hero-title>New essentials for the city</h1><p data-hero-text>Чистые силуэты, комфортные ткани и вещи, которые легко сочетать каждый день.</p><a class="button" href="catalog.html">Смотреть каталог</a></div></section><section class="section"><div class="container"><div class="section-head"><div><p class="eyebrow">Коллекция</p><h2>Категории</h2></div><a href="catalog.html">Все товары →</a></div><div class="categories" data-categories></div></div></section><section class="section"><div class="container"><div class="section-head"><div><p class="eyebrow">Избранное</p><h2>Выбор NOVA</h2></div><a href="catalog.html">В каталог →</a></div><div class="product-grid" data-featured-products></div></div></section></main><footer class="site-footer" data-footer></footer><script src="js/storage.js"></script><script src="js/main.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{try{const [p,s]=await Promise.all([loadProducts(),loadStore()]);document.querySelector('[data-hero-title]').textContent=s.heroTitle;document.querySelector('[data-hero-text]').textContent=s.heroText;document.querySelector('[data-categories]').innerHTML=getCategories(p).map(c=>`<a class="category-card" href="catalog.html?category=${c}">${categoryTitle(c)} <span>→</span></a>`).join('');document.querySelector('[data-featured-products]').innerHTML=p.filter(x=>x.featured).slice(0,8).map(x=>productCard(x,s.currency)).join('')}catch(e){console.error(e)}})</script></body></html>
